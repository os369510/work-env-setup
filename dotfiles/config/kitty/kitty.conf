# Herdr manages tabs and panes. Pass word-selection shortcuts to pane apps
# instead of using Kitty's default Ctrl+Shift+Left/Right tab navigation.
map ctrl+shift+left no_op
map ctrl+shift+right no_op

# Shift+Left/Right, Shift+Enter and Ctrl+Q already pass through by default.
# Keep Kitty's native keyboard encoding and TERM; do not send fixed escapes.
